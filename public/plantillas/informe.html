<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Informes Técnicos - M&D</title>
    <style>
        :root {
            --primary: #FFD700; /* Amarillo M&D */
            --dark: #1a1a1a;
            --gray: #f0f0f0;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- EDITOR (IZQUIERDA) --- */
        .editor-panel {
            width: 380px;
            background: #fff;
            padding: 25px;
            border-right: 1px solid #444;
            overflow-y: auto;
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
            z-index: 10;
        }

        .editor-panel h2 {
            margin-top: 0;
            color: var(--dark);
            font-size: 1.4rem;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #555; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .form-group textarea { resize: vertical; }

        .btn {
            background-color: var(--dark);
            color: var(--primary);
            border: none;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-print {
            background-color: var(--primary);
            color: var(--dark);
            font-size: 1.1rem;
            border: 2px solid var(--dark);
            margin-bottom: 20px;
            box-shadow: 0 4px 0 var(--dark);
        }
        .btn-print:active { box-shadow: 0 2px 0 var(--dark); transform: translateY(2px); }

        /* --- PREVIEW (DERECHA) --- */
        .preview-container {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: #555;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            height: auto;
            background: white;
            padding: 20mm;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            position: relative;
            box-sizing: border-box;
            color: var(--text-color);
            margin-bottom: 40px;
        }

        /* --- DISEÑO DEL DOCUMENTO --- */
        header {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-left img {
            max-width: 350px;
            max-height: 180px;
            object-fit: contain;
            display: block;
        }

        .header-right {
            text-align: right;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #444;
        }
        .header-right strong { font-size: 1.2rem; color: var(--dark); display: block; margin-bottom: 2px; }
        .header-right .contact-item { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }

        .separator-line {
            height: 3px;
            background-color: var(--primary);
            width: 100%;
            margin: 10px 0 20px 0;
            -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
        }

        .client-info-box {
            background-color: #f4f4f4;
            padding: 15px 20px;
            border-radius: 4px;
            border-left: 6px solid var(--primary);
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            align-items: start;
            -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
        }
        .client-info-col h3 { margin: 0 0 5px 0; font-size: 0.75rem; text-transform: uppercase; color: #777; letter-spacing: 0.5px; }
        .client-info-col p { margin: 0; font-size: 1.1rem; font-weight: 700; color: #000; line-height: 1.2; }
        .client-info-col small { color: #555; display: block; margin-top: 2px; }

        .doc-body {
            line-height: 1.6;
            font-size: 11pt;
            text-align: justify; /* Justificado para que el texto se vea más prolijo como informe */
            white-space: pre-wrap; /* Mantiene los saltos de línea y párrafos */
            color: #222;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            display: flex;
            justify-content: flex-end; /* Alinea la firma a la derecha */
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .footer-sign { text-align: right; display: flex; flex-direction: column; justify-content: flex-end; }

        /* --- ESTILOS DE IMPRESIÓN --- */
        @media print {
            body {
                background-color: white !important;
                margin: 0 !important;
                display: block !important;
                overflow: visible !important;
                height: auto !important;
            }
            .editor-panel { display: none !important; }
            .preview-container {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                background-color: white !important;
                width: 100% !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                border: none !important;
                min-height: 0 !important;
                height: auto !important;
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

            @page {
                margin: 1.5cm;
                size: A4;
            }
        }
    </style>
</head>
<body>

    <!-- EDITOR -->
    <div class="preview-container">
        <div class="a4-page">

            <!-- Header -->
            <header>
                <div class="header-left">
                    <!-- LOGO POR DEFECTO -->
                    <img id="logoImg" src="logo.jpeg" alt="Logo M&D">
                </div>
                <div class="header-right">
                    <strong>Sergio Maldonado</strong>
                    <div class="contact-item">📞 351 730 6105</div>
                    <div class="contact-item">✉️ mydconstrucciones10@gmail.com</div>
                </div>
            </header>

            <div class="separator-line"></div>

            <!-- Client Box -->
            <div class="client-info-box">
                <div class="client-info-col">
                    <h3>Cliente</h3>
                    <p id="outClient">Nombre del Cliente</p>
                    <small id="outClientDetail">Detalle</small>
                </div>
                <div class="client-info-col" style="text-align:right;">
                    <h3>INFORME TÉCNICO N°</h3>
                    <p id="outNum">#000</p>
                    <small id="outDate">00/00/0000</small>
                </div>
            </div>

            <!-- Body (Textazo) -->
            <div class="doc-body" id="outReportText">
                El texto del informe técnico aparecerá aquí...
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-sign">
                    <div style="border-top: 1px solid #000; width: 250px; padding-top: 5px; margin-top: 50px; text-align: center;">Firma y Aclaración</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
